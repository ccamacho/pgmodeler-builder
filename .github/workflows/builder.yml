name: Cross-platform build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      tag_name: ${{ steps.create_release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current timestamp
        run: echo "timestamp=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Fetch existing tags and get the next one
        run: |
          tags=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                      "https://api.github.com/repos/${{ github.repository }}/tags" | jq -r '.[].name')
          timestamp="${{ env.timestamp }}"
          base_tag="v0.0.1-${timestamp}"
          next_tag="$base_tag-0"

          if [[ $tags == *"$base_tag"* ]]; then
            max_number=$(echo "$tags" | grep "^$base_tag-" | sed -E 's/.*-([0-9]+)$/\1/' | sort -n | tail -n 1)
            next_number=$((max_number + 1))
            next_tag="$base_tag-$next_number"
          fi

          echo "next_tag=$next_tag" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.next_tag,
              name: `pgModeler build ${{ env.timestamp }}`,
              body: `
            ## Automated pgModeler build containing MacOS, Linux and Windows binaries.

            ### Downloading
            Download any of the pgmodeler [macos|windows|linux] binary packaged [zip|tar.gz] files, extract them, and run the pgmodeler executable file.

            ### Extra files
            Both Source code[zip|tar.gz] files have the source code of pgmodeler-builder. This repository is empty and only have the GitHub action to create the binary files.
              `,
              draft: true,
              prerelease: true,
            });
            core.setOutput('release_id', response.data.id);
            core.setOutput('tag_name', process.env.next_tag);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-build:
    runs-on: windows-latest
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: v1.2.3
            build_system: qmake
            qt: '6.6.1'
          - branch: v2.0.0-beta
            build_system: cmake
            qt: '6.6.1'

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: pgmodeler/pgmodeler
        ref: ${{ matrix.branch }}

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          zip base-devel
          mingw-w64-x86_64-make
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-postgresql
          mingw-w64-x86_64-qt6
          mingw-w64-x86_64-libxml2

    - name: Set build directory
      run: echo "BUILD_DIR=$(cygpath -m "$GITHUB_WORKSPACE/build")" >> $GITHUB_ENV

    # --- qmake build (v1.x) ---
    - name: Running qmake
      if: matrix.build_system == 'qmake'
      run: |
        cd $GITHUB_WORKSPACE
        qmake pgmodeler.pro -spec win32-clang-g++ -r \
          PREFIX=$BUILD_DIR \
          XML_INC=$(cygpath -m /mingw64/include/libxml2) \
          XML_LIB=$(cygpath -m /mingw64/lib/libxml2.dll.a) \
          PGSQL_INC=$(cygpath -m /mingw64/include) \
          PGSQL_LIB=$(cygpath -m /mingw64/bin/libpq.dll) \
          CONFIG+=release

    - name: Building with qmake
      if: matrix.build_system == 'qmake'
      run: mingw32-make -j$(nproc)

    - name: Installing qmake build
      if: matrix.build_system == 'qmake'
      run: mingw32-make install

    # --- cmake build (v2.x) ---
    - name: Patch cmake paths for CI
      if: matrix.build_system == 'cmake'
      run: |
        cd $GITHUB_WORKSPACE
        MSYS2_ROOT=$(cygpath -m /)
        MSYS2_ROOT=${MSYS2_ROOT%/}
        sed -i "s|C:/msys64|${MSYS2_ROOT}|g" BuildConfs.cmake
        sed -i '1s/^/#include <QApplication>\n/' libs/libgui/src/tools/modelexporthelper.cpp

    - name: Running cmake
      if: matrix.build_system == 'cmake'
      run: |
        cd $GITHUB_WORKSPACE
        cmake -B build-dir -G "MinGW Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DPGM_PREFIX=$BUILD_DIR

    - name: Building with cmake
      if: matrix.build_system == 'cmake'
      run: cmake --build $GITHUB_WORKSPACE/build-dir -j$(nproc)

    - name: Installing cmake build
      if: matrix.build_system == 'cmake'
      run: cmake --install $GITHUB_WORKSPACE/build-dir

    # --- common post-build ---
    - name: Copy runtime libraries
      run: |
        for lib in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll \
                   libxml2-2.dll libpq.dll libiconv-2.dll libintl-8.dll \
                   zlib1.dll liblzma-5.dll libzstd.dll \
                   libssl-3-x64.dll libcrypto-3-x64.dll \
                   libicudt*.dll libicuin*.dll libicuuc*.dll \
                   libpcre2-16-0.dll libpcre2-8-0.dll \
                   libpng16-16.dll libbz2-1.dll libharfbuzz-0.dll \
                   libfreetype-6.dll libglib-2.0-0.dll libdouble-conversion.dll \
                   libb2-1.dll libmd4c.dll libbrotlidec.dll libbrotlicommon.dll \
                   libgraphite2.dll; do
          for f in /mingw64/bin/$lib; do
            [ -f "$f" ] && cp -n "$f" "$BUILD_DIR/" 2>/dev/null || true
          done
        done

    - name: Running windeployqt
      run: |
        cd $BUILD_DIR
        windeployqt --compiler-runtime --release pgmodeler.exe

    - name: Generate the .iss file
      run: |
        cat <<EOF > $BUILD_DIR/pgModeler.iss
        [Setup]
        AppName=pgModeler
        AppVersion=${{ matrix.branch }}
        DefaultDirName={pf}\\pgModeler
        DefaultGroupName=pgModeler
        OutputBaseFilename=pgmodeler_setup
        Compression=lzma
        SolidCompression=yes

        [Files]
        Source: "$BUILD_DIR/pgmodeler.exe"; DestDir: "{app}"; Flags: ignoreversion
        Source: "$BUILD_DIR/*"; DestDir: "{app}"; Flags: ignoreversion createallsubdirs recursesubdirs

        [Icons]
        Name: "{group}\\pgModeler"; Filename: "{app}\\pgmodeler.exe"
        Name: "{group}\\Uninstall pgModeler"; Filename: "{uninstallexe}"

        [Run]
        Filename: "{app}\\pgmodeler.exe"; Description: "{cm:LaunchProgram,PGModeler}"; Flags: nowait postinstall skipifsilent
        EOF

    - name: Create the iscc installer
      run: |
        export ISCC_PATH="/c/Program Files (x86)/Inno Setup 6/iscc.exe"
        "$ISCC_PATH" $BUILD_DIR/pgModeler.iss

    - name: Upload the setup file as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: pgmodeler-windows-setup-${{ matrix.branch }}.exe
        path: ${{ env.BUILD_DIR }}/Output/pgmodeler_setup.exe

    - name: Upload the setup file to release
      shell: bash
      run: |
        cp "$BUILD_DIR/Output/pgmodeler_setup.exe" \
           "$GITHUB_WORKSPACE/pgmodeler-windows-setup-${{ matrix.branch }}.exe"
        gh release upload "${{ needs.create-release.outputs.tag_name }}" \
          "$GITHUB_WORKSPACE/pgmodeler-windows-setup-${{ matrix.branch }}.exe" \
          --repo "${{ github.repository }}" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload the build files as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: pgmodeler-windows-build-${{ matrix.branch }}.zip
        path: ${{ env.BUILD_DIR }}

    - name: Zip the build files
      run: |
        cd $GITHUB_WORKSPACE
        zip -r pgmodeler-windows-build-${{ matrix.branch }}.zip build/*

    - name: Upload the build zip to release
      shell: bash
      run: |
        gh release upload "${{ needs.create-release.outputs.tag_name }}" \
          "$GITHUB_WORKSPACE/pgmodeler-windows-build-${{ matrix.branch }}.zip" \
          --repo "${{ github.repository }}" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-build:
    runs-on: ubuntu-22.04
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: v1.2.3
            build_system: qmake
            qt: '6.6.1'
          - branch: v2.0.0-beta
            build_system: cmake
            qt: '6.6.1'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: pgmodeler/pgmodeler
        path: 'pgmodeler'
        ref: ${{ matrix.branch }}

    - name: Installing Qt framework
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt }}
        cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            libxcb-cursor0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 \
            build-essential libfuse2 \
            libpq-dev libxml2-dev \
            clang imagemagick

    - name: Set install directory
      run: |
        echo "INSTALL_DIR=$GITHUB_WORKSPACE/pgmodeler/AppDir/usr" >> $GITHUB_ENV
        echo "QT_ROOT=$(qmake -query QT_INSTALL_PREFIX)" >> $GITHUB_ENV

    # --- qmake build (v1.x) ---
    - name: Running qmake
      if: matrix.build_system == 'qmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        qmake pgmodeler.pro \
            -r PREFIX=$INSTALL_DIR \
               BINDIR=$INSTALL_DIR/bin \
               PRIVATEBINDIR=$INSTALL_DIR/bin \
               PRIVATELIBDIR=$INSTALL_DIR/lib \
               CONFDIR=$INSTALL_DIR/bin \
               CONFIG+=release

    - name: Building with qmake
      if: matrix.build_system == 'qmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        make -j$(nproc)

    - name: Installing qmake build
      if: matrix.build_system == 'qmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        make install

    # --- cmake build (v2.x) ---
    - name: Patch source for CI compatibility
      if: matrix.build_system == 'cmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        sed -i '1s/^/#include <QApplication>\n/' libs/libgui/src/tools/modelexporthelper.cpp

    - name: Running cmake
      if: matrix.build_system == 'cmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        cmake -B build-dir \
          -DCMAKE_BUILD_TYPE=Release \
          -DPGM_PREFIX=$INSTALL_DIR \
          -DCMAKE_PREFIX_PATH=$QT_ROOT \
          -DAPPIMAGE_BUILD=ON

    - name: Building with cmake
      if: matrix.build_system == 'cmake'
      run: cmake --build $GITHUB_WORKSPACE/pgmodeler/build-dir -j$(nproc)

    - name: Installing cmake build
      if: matrix.build_system == 'cmake'
      run: cmake --install $GITHUB_WORKSPACE/pgmodeler/build-dir

    # --- common AppImage creation ---
    - name: Sanitize version string
      run: |
        VER=${{ matrix.branch }}
        SANITIZED_VERSION=${VER#v}
        echo "SANITIZED_VERSION=$SANITIZED_VERSION" >> $GITHUB_ENV

    - name: Create desktop file and prepare icon
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        cat > pgmodeler.desktop <<DESKTOP
        [Desktop Entry]
        Type=Application
        Name=pgModeler
        Comment=PostgreSQL Database Modeler
        Exec=pgmodeler
        Icon=pgmodeler
        Categories=Development;Database;
        DESKTOP
        convert assets/conf/pgmodeler_logo.png -resize 256x256 pgmodeler.png

    - name: Download linuxdeploy
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

    - name: Create the pgmodeler AppImage
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        export VERSION=$SANITIZED_VERSION
        export QMAKE=$QT_ROOT/bin/qmake
        export LD_LIBRARY_PATH=$INSTALL_DIR/lib:$INSTALL_DIR/lib/pgmodeler:$LD_LIBRARY_PATH

        ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/pgmodeler \
            --desktop-file pgmodeler.desktop \
            --icon-file pgmodeler.png \
            --plugin qt \
            --output appimage

        mv pgModeler-*.AppImage pgModeler-$SANITIZED_VERSION-x86_64.AppImage 2>/dev/null \
          || mv pgmodeler-*.AppImage pgModeler-$SANITIZED_VERSION-x86_64.AppImage 2>/dev/null \
          || true

    - name: Upload the AppImage as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: pgModeler-${{ env.SANITIZED_VERSION }}-x86_64.AppImage
        path: ${{ github.workspace }}/pgmodeler/pgModeler-${{ env.SANITIZED_VERSION }}-x86_64.AppImage

    - name: Upload the AppImage to release
      run: |
        gh release upload "${{ needs.create-release.outputs.tag_name }}" \
          "$GITHUB_WORKSPACE/pgmodeler/pgModeler-$SANITIZED_VERSION-x86_64.AppImage" \
          --repo "${{ github.repository }}" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload the build files as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: pgmodeler-linux-build-${{ matrix.branch }}.zip
        path: ${{ github.workspace }}/pgmodeler/AppDir/usr

    - name: Zip and upload build files to release
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        zip -r pgmodeler-linux-build-${{ matrix.branch }}.zip AppDir/usr/*
        gh release upload "${{ needs.create-release.outputs.tag_name }}" \
          "pgmodeler-linux-build-${{ matrix.branch }}.zip" \
          --repo "${{ github.repository }}" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-build:
    runs-on: macos-15
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: v1.2.3
            build_system: qmake
            qt: '6.6.1'
            pg_version: '15'
          - branch: v2.0.0-beta
            build_system: cmake
            qt: '6.6.1'
            pg_version: '17'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: pgmodeler/pgmodeler
        path: 'pgmodeler'
        ref: ${{ matrix.branch }}

    - name: Installing Qt framework
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt }}
        cache: true

    - name: Patch Qt to remove AGL framework reference
      run: |
        QT_ROOT=$(qmake -query QT_INSTALL_PREFIX)
        find "$QT_ROOT" -name "*.prl" | xargs grep -l "\-framework AGL" | \
          xargs sed -i '' 's/ -framework AGL//g' 2>/dev/null || true
        find "$QT_ROOT" -name "*.cmake" | xargs grep -l "AGL" | \
          xargs sed -i '' 's/ -framework AGL//g' 2>/dev/null || true
        find "$QT_ROOT" -name "*.pri" | xargs grep -l "AGL" | \
          xargs sed -i '' 's/ -framework AGL//g' 2>/dev/null || true

    - name: Installing PostgreSQL and dependencies
      run: |
        brew install --quiet postgresql@${{ matrix.pg_version }}
        brew unlink --quiet postgresql@${{ matrix.pg_version }} 2>/dev/null || true
        brew link --quiet --overwrite postgresql@${{ matrix.pg_version }}
        brew reinstall openssl@3
        brew install --quiet libxml2 libpq

    - name: Set environment
      run: |
        PG_PREFIX=$(brew --prefix postgresql@${{ matrix.pg_version }})
        OPENSSL_PREFIX=$(brew --prefix openssl@3)
        QT_ROOT=$(qmake -query QT_INSTALL_PREFIX)
        INSTALLATION_ROOT=$GITHUB_WORKSPACE/pgmodeler/pgModeler.app

        echo "PG_PREFIX=$PG_PREFIX" >> $GITHUB_ENV
        echo "OPENSSL_PREFIX=$OPENSSL_PREFIX" >> $GITHUB_ENV
        echo "QT_ROOT=$QT_ROOT" >> $GITHUB_ENV
        echo "INSTALLATION_ROOT=$INSTALLATION_ROOT" >> $GITHUB_ENV

    # --- qmake build (v1.x) ---
    - name: Running qmake
      if: matrix.build_system == 'qmake'
      run: |
        export LDFLAGS="-L$PG_PREFIX/lib"
        export CPPFLAGS="-I$PG_PREFIX/include"
        cd $GITHUB_WORKSPACE/pgmodeler
        qmake pgmodeler.pro -r \
            PREFIX=$INSTALLATION_ROOT/Contents \
            PGSQL_INC="$PG_PREFIX/include" \
            PGSQL_LIB="$PG_PREFIX/lib/libpq.dylib" \
            CONFIG+=release \
            CONFIG+=sdk_no_version_check

    - name: Building with qmake
      if: matrix.build_system == 'qmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        make -j$(sysctl -n hw.ncpu)
        make install

    # --- cmake build (v2.x) ---
    - name: Patch cmake paths for CI
      if: matrix.build_system == 'cmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        PG_INCDIR=$(pg_config --includedir)
        PG_LIBDIR=$(pg_config --libdir)
        sed -i '' "s|/Library/PostgreSQL/17/include|${PG_INCDIR}|g" DefaultPaths.cmake
        sed -i '' "s|/Library/PostgreSQL/17/lib/libpq.dylib|${PG_LIBDIR}/libpq.dylib|g" DefaultPaths.cmake
        sed -i '' $'1s/^/#include <QApplication>\\n/' libs/libgui/src/tools/modelexporthelper.cpp

    - name: Running cmake
      if: matrix.build_system == 'cmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        cmake -B build-dir \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH=$QT_ROOT \
          -DPGM_PREFIX=$INSTALLATION_ROOT/Contents

    - name: Building with cmake
      if: matrix.build_system == 'cmake'
      run: |
        cd $GITHUB_WORKSPACE/pgmodeler
        cmake --build build-dir -j$(sysctl -n hw.ncpu)
        cmake --install build-dir

    # --- common post-build ---
    - name: Create Info.plist if missing
      run: |
        VER=${{ matrix.branch }}
        SANITIZED_VERSION=${VER#v}
        echo "SANITIZED_VERSION=$SANITIZED_VERSION" >> $GITHUB_ENV

        if [ ! -f "$INSTALLATION_ROOT/Contents/Info.plist" ]; then
          mkdir -p "$INSTALLATION_ROOT/Contents"
          cat > "$INSTALLATION_ROOT/Contents/Info.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>pgmodeler</string>
            <key>CFBundleIdentifier</key>
            <string>io.pgmodeler</string>
            <key>CFBundleName</key>
            <string>pgModeler</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>$SANITIZED_VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$SANITIZED_VERSION</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        PLIST
        fi

    - name: Copy dependency libraries
      run: |
        mkdir -p $INSTALLATION_ROOT/Contents/Frameworks

        cp $PG_PREFIX/lib/libpq.5.dylib $INSTALLATION_ROOT/Contents/Frameworks/ 2>/dev/null || true
        cp $OPENSSL_PREFIX/lib/libssl.* $INSTALLATION_ROOT/Contents/Frameworks/ 2>/dev/null || true
        cp $OPENSSL_PREFIX/lib/libcrypto.* $INSTALLATION_ROOT/Contents/Frameworks/ 2>/dev/null || true

        cd $INSTALLATION_ROOT/Contents/Frameworks
        install_name_tool -change "@loader_path/../lib/libcrypto.3.dylib" \
          "@loader_path/../Frameworks/libcrypto.3.dylib" libssl.3.dylib 2>/dev/null || true
        install_name_tool -change "@loader_path/../lib/libcrypto.3.dylib" \
          "@loader_path/../Frameworks/libcrypto.3.dylib" libpq.5.dylib 2>/dev/null || true
        install_name_tool -change "@loader_path/../lib/libssl.3.dylib" \
          "@loader_path/../Frameworks/libssl.3.dylib" libpq.5.dylib 2>/dev/null || true

    - name: Run macdeployqt
      run: |
        $QT_ROOT/bin/macdeployqt $INSTALLATION_ROOT \
            -executable=$INSTALLATION_ROOT/Contents/MacOS/pgmodeler-ch \
            -executable=$INSTALLATION_ROOT/Contents/MacOS/pgmodeler-cli

    - name: Create .dmg from .app
      run: |
        hdiutil create -volname "pgModeler" \
                   -srcfolder "$INSTALLATION_ROOT" \
                   -ov -format UDZO "/tmp/pgModeler.dmg"

    - name: Upload the .dmg as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: pgModeler-${{ env.SANITIZED_VERSION }}-arm.dmg
        path: /tmp/pgModeler.dmg

    - name: Upload the .dmg to release
      run: |
        cp /tmp/pgModeler.dmg "/tmp/pgModeler-$SANITIZED_VERSION-arm.dmg"
        gh release upload "${{ needs.create-release.outputs.tag_name }}" \
          "/tmp/pgModeler-$SANITIZED_VERSION-arm.dmg" \
          --repo "${{ github.repository }}" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload the build files as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: pgmodeler-macos-build-${{ matrix.branch }}.zip
        path: ${{ github.workspace }}/pgmodeler/pgModeler.app

    - name: Zip and upload build files to release
      run: |
        cd $GITHUB_WORKSPACE
        zip -r pgmodeler-macos-build-${{ matrix.branch }}.zip pgmodeler/pgModeler.app/*
        gh release upload "${{ needs.create-release.outputs.tag_name }}" \
          "pgmodeler-macos-build-${{ matrix.branch }}.zip" \
          --repo "${{ github.repository }}" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-release:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - create-release
      - linux-build
      - windows-build
      - macos-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check and Delete Release if Only Default Assets Exist
        uses: actions/github-script@v7
        with:
          script: |
            const release_id = '${{ needs.create-release.outputs.release_id }}';
            const tag_name = '${{ needs.create-release.outputs.tag_name }}';

            const assetsResponse = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id
            });

            const assets = assetsResponse.data;

            console.log('Assets in the release:');
            assets.forEach(asset => {
              console.log(`- ${asset.name}`);
            });

            const defaultAssets = assets.filter(asset =>
              asset.name === 'Source code (zip)' || asset.name === 'Source code (tar.gz)'
            );

            if (assets.length === defaultAssets.length) {
              console.log(`Only default source code assets found. Deleting release with ID: ${release_id}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id
              });

              console.log(`Release deleted. Now deleting the tag: ${tag_name}`);

              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tag_name}`
                });
                console.log(`Tag ${tag_name} exists. Proceeding to delete.`);
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tag_name}`
                });
                console.log(`Release and tag ${tag_name} deleted successfully.`);
              } catch (error) {
                if (error.status === 404) {
                  console.log(`Tag ${tag_name} does not exist. No action needed.`);
                } else {
                  console.log(`Error checking for tag existence: ${error.message}`);
                  throw error;
                }
              }
            } else {
              console.log('Non-default assets found. This release will not be deleted.');
              console.log('Moving the release to draft=false, prerelease=false.');

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                draft: false,
                prerelease: false
              });
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
